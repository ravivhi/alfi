# Publishes alfi automatically: every push to main that changes web/ asks ravivhi/guessingGame
# to run its "Sync alfi" workflow, which pulls web/ from this repo onto https://ravivh.com/alfi/.
#
# Needs the repo secret GUESSINGGAME_DISPATCH_TOKEN: a fine-grained token for ravivhi/guessingGame
# only, with only "Actions: Read and write". It can start (or stop) workflows there, but it cannot
# read or change any code in guessingGame.
name: Publish to ravivh.com/alfi

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:   # publish now without a code change (Actions → this workflow → Run workflow)

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Start "Sync alfi" in guessingGame
        env:
          GH_TOKEN: ${{ secrets.GUESSINGGAME_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The secret GUESSINGGAME_DISPATCH_TOKEN is not set in ravivhi/alfi."
            exit 1
          fi
          gh workflow run sync-alfi.yml -R ravivhi/guessingGame
          echo "Started. Progress: https://github.com/ravivhi/guessingGame/actions/workflows/sync-alfi.yml"
