<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אלפי - בדיקת קווי הכתיבה</title>
<!-- Review page for the owner: draws every letter's strokes from letters-3-5.json (writing order and direction).
     Open with the dev server: npm run dev, then http://localhost:5173/content/strokes-preview.html -->
<style>
  @font-face { font-family: Rubik; font-weight: 300 900; src: url(/fonts/rubik-hebrew.woff2) format('woff2'); }
  body { margin: 0; padding: 16px; font-family: Rubik, Arial, sans-serif; background: #F4F7FB; color: #1D2742; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.note { margin: 0 0 14px; color: #4A5878; max-width: 900px; }
  .legend span { display: inline-block; margin-inline-end: 14px; font-weight: 700; }
  .group { margin: 18px 0 6px; font-weight: 700; color: #4A5878; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 2px solid #D5DEEA; border-radius: 14px; padding: 8px; }
  .card.bad { border-color: #E53935; }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card svg { width: 100%; height: auto; display: block; background: #FBFCFE; border-radius: 10px; }
  .card ol { margin: 6px 0 0; padding-inline-start: 22px; font-size: 13px; color: #4A5878; direction: ltr; text-align: left; }
  .err { color: #E53935; font-weight: 700; }
</style>
</head>
<body>
<h1>בדיקת קווי הכתיבה - כל 22 האותיות</h1>
<p class="note">כל קו מתחיל בעיגול עם המספר שלו (סדר הכתיבה) ונגמר בחץ (כיוון הכתיבה). האות האפורה מאחור היא האות בגופן של האפליקציה. הקווים הכחולים הדקים הם שורת הכתיבה (למעלה ולמטה).</p>
<p class="legend"><span style="color:#E53935">קו 1</span><span style="color:#1E6FD9">קו 2</span><span style="color:#2E9E5B">קו 3</span></p>
<div id="out"><p>טוען את letters-3-5.json...</p></div>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const COLORS = ['#E53935', '#1E6FD9', '#2E9E5B'];
  const GROUP = 3; // letters per check-point group (curriculum-letters.json checkpoint.everyUnits)

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
    if (parent) parent.appendChild(e);
    return e;
  }

  // Start point of an SVG path that begins with "M x y".
  function startOf(d) {
    const m = d.match(/^M\s*(-?[\d.]+)[\s,]+(-?[\d.]+)/);
    return m ? { x: +m[1], y: +m[2] } : null;
  }

  function problems(strokes) {
    const out = [];
    if (strokes.length < 1 || strokes.length > 3) out.push('צריך 1-3 קווים');
    strokes.forEach((d, i) => {
      if (!/^M\s/.test(d)) out.push(`קו ${i + 1} לא מתחיל ב-M`);
      if ((d.match(/-?\d+(\.\d+)?/g) || []).some(n => +n < 0 || +n > 300)) out.push(`קו ${i + 1} יוצא מהלוח`);
    });
    return out;
  }

  function card(L, entry, name) {
    const div = document.createElement('div');
    div.className = 'card';
    div.setAttribute('data-letter', L);
    const h = document.createElement('h2');
    h.textContent = `${L} - ${name}`;
    div.appendChild(h);

    const svg = el('svg', { viewBox: '0 0 300 300', role: 'img', 'aria-label': 'קווי הכתיבה של האות ' + L }, div);
    const defs = el('defs', {}, svg);
    COLORS.forEach((c, i) => {
      const m = el('marker', { id: `arrow-${L}-${i}`, viewBox: '0 0 10 10', refX: 6, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' }, defs);
      el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: c }, m);
    });
    for (let v = 0; v <= 300; v += 20) {
      el('line', { x1: v, y1: 0, x2: v, y2: 300, stroke: v % 100 ? '#EEF1F5' : '#DDE3EB', 'stroke-width': 1 }, svg);
      el('line', { x1: 0, y1: v, x2: 300, y2: v, stroke: v % 100 ? '#EEF1F5' : '#DDE3EB', 'stroke-width': 1 }, svg);
    }
    for (const y of [60, 240]) el('line', { x1: 0, y1: y, x2: 300, y2: y, stroke: '#9CC3F5', 'stroke-width': 1.5 }, svg);
    // the glyph in the app font, faint behind: letter height 60..240 on the board
    const t = el('text', { x: 150, y: 240, 'text-anchor': 'middle', 'font-family': 'Rubik, sans-serif', 'font-weight': 500, 'font-size': 315, fill: '#000', opacity: 0.12 }, svg);
    t.textContent = L;

    entry.strokes.forEach((d, i) => {
      const c = COLORS[i % COLORS.length];
      el('path', { d, fill: 'none', stroke: c, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'marker-end': `url(#arrow-${L}-${i % COLORS.length})`, 'data-stroke': i + 1 }, svg);
    });
    entry.strokes.forEach((d, i) => {
      const s = startOf(d);
      if (!s) return;
      const c = COLORS[i % COLORS.length];
      el('circle', { cx: s.x, cy: s.y, r: 11, fill: c }, svg);
      const n = el('text', { x: s.x, y: s.y + 5, 'text-anchor': 'middle', 'font-family': 'Arial, sans-serif', 'font-size': 14, 'font-weight': 700, fill: '#fff' }, svg);
      n.textContent = String(i + 1);
    });

    const bad = problems(entry.strokes);
    if (bad.length) {
      div.classList.add('bad');
      const p = document.createElement('p');
      p.className = 'err';
      p.textContent = bad.join(', ');
      div.appendChild(p);
    }
    const ol = document.createElement('ol');
    entry.strokes.forEach(d => { const li = document.createElement('li'); li.textContent = d; ol.appendChild(li); });
    div.appendChild(ol);
    return div;
  }

  function render(c) {
    const out = document.getElementById('out');
    out.textContent = '';
    for (let g = 0; g < c.order.length; g += GROUP) {
      const letters = c.order.slice(g, g + GROUP);
      const head = document.createElement('p');
      head.className = 'group';
      head.textContent = `קבוצה ${g / GROUP + 1}: ${letters.join(' ')}` + (letters.length === GROUP ? ' - ואחריה נקודת בדיקה' : '');
      out.appendChild(head);
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const L of letters) {
        const entry = c.letters[L];
        if (entry) grid.appendChild(card(L, entry, c.alphabet[L] ? c.alphabet[L].name : ''));
      }
      out.appendChild(grid);
    }
  }

  window.renderStrokesPreview = render;
  if (!window.STROKES_PREVIEW_NO_FETCH) {
    fetch('letters-3-5.json')
      .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
      .then(render)
      .catch(e => {
        document.getElementById('out').innerHTML = '<p class="err"></p>';
        document.querySelector('#out .err').textContent = 'לא הצלחתי לטעון את letters-3-5.json (' + e.message + '). צריך לפתוח את הדף דרך npm run dev.';
      });
  }
</script>
</body>
</html>
